name: Backend Integration Pipeline

on:
  push:
    branches: "main"
  pull_request:
    branches: "main"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarga todo el historial de commits para SonarCloud

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del código
        run: node --check src/index.js

      - name: Comprobar que la documentación generada está al día
        run: npm run docs:check

      # Genera coverage/lcov.info, que SonarCloud usa para medir la cobertura
      - name: Ejecutar pruebas automatizadas con cobertura
        run: npm run test:coverage

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}