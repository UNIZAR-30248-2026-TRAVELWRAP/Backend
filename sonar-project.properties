sonar.projectKey=UNIZAR-30248-2026-TRAVELWRAP_Backend
sonar.organization=unizar-30248-2026-travelwrap

# Indicar la carpeta del código fuente a analizar
sonar.sources=src

# Excluir carpetas no relevantes para el análisis de código
sonar.exclusions=node_modules/**, docs/**, scripts/**

# Pruebas y cobertura (el informe lo genera npm run test:coverage en la CI)
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Arranque del servidor y configuración: no se prueban con tests unitarios
sonar.coverage.exclusions=src/index.js, src/config/**

# Codificación
sonar.sourceEncoding=UTF-8