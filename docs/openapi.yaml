openapi: 3.0.0
info:
  title: TravelWrap API
  description: API REST para la gestión de viajes grupales, gastos y tareas.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths:
  /health:
    get:
      summary: Comprueba el estado del servidor
      responses:
        '200':
          description: Servidor operativo

  /auth/registro:
    post:
      tags:
        - Autenticación
      summary: Registra un usuario con email y contraseña
      description: |
        Crea la cuenta en Supabase Auth guardando el nombre. El proyecto exige confirmar el email, así que lo normal es que
        la respuesta sea `201` con `confirmacion_pendiente: true` (sin tokens): el usuario recibe un correo y, una vez confirmado,
        inicia sesión con `POST /auth/login`, momento en el que se crea su fila en `perfiles`.
        Si el proyecto no exigiera confirmar el email, la respuesta incluye ya la sesión (`token` y `refresh_token`) y el perfil queda creado.
        Si el email ya tiene cuenta confirmada, responde 409. Si la cuenta existe pero no está confirmada, se reenvía el correo de confirmación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada. Pendiente de confirmar el email, o con sesión iniciada si no se exige confirmación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
              examples:
                confirmacionPendiente:
                  summary: Confirmación de email pendiente (caso habitual)
                  value:
                    usuario:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      nombre: Daniel
                      email: daniel@travelwrap.app
                      avatar_url: null
                      creado_en: '2026-10-11T18:00:00Z'
                    confirmacion_pendiente: true
        '400':
          description: Datos inválidos (nombre vacío o de más de 100 caracteres, email mal formado o contraseña de menos de 8 caracteres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombre:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El nombre es obligatorio y tiene un máximo de 100 caracteres
                email:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El email no es válido
                password:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: La contraseña debe tener al menos 8 caracteres
        '409':
          description: Ya existe una cuenta con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: email_en_uso
                  mensaje: Ya existe una cuenta con ese email
        '429':
          description: Demasiados intentos; Supabase limita el envío de correos de confirmación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: demasiados_intentos
                  mensaje: Demasiados intentos, inténtalo más tarde
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reenviar-confirmacion:
    post:
      tags:
        - Autenticación
      summary: Reenvía el correo de confirmación de la cuenta
      description: |
        Para usuarios registrados que aún no han confirmado su email (el login responde 401 `email_no_confirmado`).
        Por seguridad responde siempre `202` con el mismo mensaje, exista o no una cuenta pendiente con ese email,
        para no revelar qué emails están registrados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioConfirmacionRequest'
      responses:
        '202':
          description: Solicitud aceptada. Si hay una cuenta pendiente de confirmar con ese email, recibirá un correo nuevo
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Si existe una cuenta pendiente de confirmar con ese email, recibirás un correo de confirmación
        '400':
          description: Email con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El email no es válido
        '429':
          description: Se han pedido demasiados correos seguidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: demasiados_intentos
                  mensaje: Espera un momento antes de volver a pedir el correo
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicia sesión con email y contraseña
      description: Autentica al usuario mediante Supabase Auth y devuelve el usuario, el token de acceso (JWT) y el refresh token. El token se envía en el resto de peticiones con la cabecera Authorization Bearer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos de entrada inválidos (email con formato incorrecto o contraseña vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El email no es válido
        '401':
          description: Credenciales incorrectas o email sin confirmar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                credencialesInvalidas:
                  value:
                    error:
                      codigo: credenciales_invalidas
                      mensaje: Email o contraseña incorrectos
                emailNoConfirmado:
                  value:
                    error:
                      codigo: email_no_confirmado
                      mensaje: El email no está confirmado
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renueva la sesión con el refresh token
      description: Intercambia un refresh token válido por un nuevo token de acceso y un nuevo refresh token mediante Supabase Auth. Permite mantener la sesión iniciada al volver a abrir la aplicación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión renovada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Falta el refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El refresh_token es obligatorio
        '401':
          description: El refresh token ha caducado, ya se ha usado o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: sesion_invalida
                  mensaje: La sesión ha caducado o no es válida
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cierra la sesión actual
      description: |
        Invalida en Supabase Auth la sesión del dispositivo que hace la petición (alcance `local`): el refresh token deja de servir
        y Supabase rechaza el token de acceso. Las sesiones abiertas en otros dispositivos no se tocan.
        La PWA llama a este endpoint al confirmar «Cerrar sesión» y, aunque falle, borra siempre la sesión guardada en el navegador.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada. Sin contenido
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_autenticacion
                  mensaje: No se ha podido cerrar la sesión

  /auth/google:
    get:
      tags:
        - Autenticación
      summary: Inicia el login con Google (OAuth 2.0 + PKCE)
      description: |
        Punto de entrada del botón «Continuar con Google». La PWA navega a esta URL (no es una llamada fetch).
        El backend genera el flujo PKCE de Supabase Auth, guarda el verificador en la cookie `tw_oauth`
        y redirige a Supabase, que a su vez redirige a la pantalla de consentimiento de Google.
        Cuando el usuario acepta, Supabase vuelve a `GET /auth/google/callback`.
      security: []
      responses:
        '302':
          description: |
            Redirección. Si el flujo se ha podido iniciar, `Location` apunta a
            `{SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=...&code_challenge=...&code_challenge_method=s256`
            y se envía la cookie `tw_oauth`. Si no, redirige a la PWA con `#error=google`.
          headers:
            Location:
              description: URL de autorización de Supabase, o `{FRONTEND_URL}/auth/callback#error=google` si falla
              schema:
                type: string
                format: uri
              example: https://gbnivsmutqlnqvcrmcvj.supabase.co/auth/v1/authorize?provider=google&redirect_to=http%3A%2F%2Flocalhost%3A3000%2Fapi%2Fauth%2Fgoogle%2Fcallback&code_challenge=jpsA5IMF546ZtE29jcPPiDoEWJOAtBkNUOoeGzozmAM&code_challenge_method=s256
            Set-Cookie:
              description: Cookie con el estado PKCE del flujo, codificado en base64url. HttpOnly, SameSite=Lax, Path=/api/auth/google, caduca en 10 minutos
              schema:
                type: string
              example: tw_oauth=eyJzYi1...; Max-Age=600; Path=/api/auth/google; HttpOnly; SameSite=Lax

  /auth/google/callback:
    get:
      tags:
        - Autenticación
      summary: Recibe la respuesta de Google y completa el login
      description: |
        URL de vuelta configurada en Supabase (Authentication → URL Configuration → Redirect URLs).
        El backend canjea el `code` por la sesión usando el verificador PKCE de la cookie `tw_oauth`, borra la cookie
        y, si es el primer acceso del usuario, crea su fila en `perfiles` con el nombre, el email y la foto de Google.
        Si ya existía una cuenta con el mismo email verificado, Supabase la vincula al mismo usuario.

        El resultado se entrega a la PWA redirigiendo a `{FRONTEND_URL}/auth/callback` con un fragmento (`#`),
        que el navegador no envía a ningún servidor:
        - Éxito: `#sesion=<base64url de un JSON con el formato de LoginResponse>`
        - Usuario cancela en Google: `#error=google_cancelado`
        - Cualquier otro fallo (falta la cookie o el código, código inválido o caducado): `#error=google`
      security:
        - oauthStateCookie: []
      parameters:
        - name: code
          in: query
          required: false
          description: Código de autorización de un solo uso que envía Supabase si el usuario acepta
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Presente si el usuario cancela o Google rechaza el acceso
          schema:
            type: string
            example: access_denied
        - name: error_description
          in: query
          required: false
          description: Descripción del error enviada por Supabase
          schema:
            type: string
      responses:
        '302':
          description: Redirección a la PWA con el resultado en el fragmento de la URL. Siempre borra la cookie `tw_oauth`
          headers:
            Location:
              description: '`{FRONTEND_URL}/auth/callback#sesion=...`, `#error=google_cancelado` o `#error=google`'
              schema:
                type: string
                format: uri
              examples:
                exito:
                  value: http://localhost:5173/auth/callback#sesion=eyJ1c3VhcmlvIjp7ImlkIjoiZGY3N2Nj...
                cancelado:
                  value: http://localhost:5173/auth/callback#error=google_cancelado
                error:
                  value: http://localhost:5173/auth/callback#error=google

  /viajes:
    get:
      tags:
        - Viajes
      summary: Lista los viajes del usuario
      description: |
        Devuelve los viajes de los que el usuario es miembro activo, del más reciente al más antiguo, con sus miembros.
        La PWA los reparte en «Mis viajes»: los activos con destino (tarjeta azul), los activos sin destino
        (`pendiente_destino: true`, tarjeta verde) y, por estado, los finalizados y archivados (viajes anteriores).
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Devuelve solo los viajes en ese estado
          schema:
            type: string
            enum: [activo, finalizado, archivado]
      responses:
        '200':
          description: Viajes del usuario (lista vacía si no tiene ninguno)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaViajes'
        '400':
          description: El filtro `estado` no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El estado debe ser activo, finalizado o archivado
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se han podido obtener los viajes
    post:
      tags:
        - Viajes
      summary: Crea un viaje
      description: |
        Crea un viaje activo y añade al usuario como miembro con rol `creador`, en una sola operación.
        El nombre y el presupuesto son obligatorios. Las fechas y el destino son opcionales.
        Si no se indica destino (`null`, ausente o cadena vacía) el viaje queda **pendiente de destino**
        (`pendiente_destino: true`): hasta que el creador fije el destino por votación, solo se podrá votar e invitar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoViajeRequest'
      responses:
        '201':
          description: Viaje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombre:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El nombre es obligatorio y tiene un máximo de 100 caracteres
                presupuesto:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El presupuesto es obligatorio y debe ser un número entre 0 y 9999999999
                fechas:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: La fecha de fin no puede ser anterior a la de inicio
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido crear el viaje

  /viajes/{viajeId}:
    get:
      tags:
        - Viajes
      summary: Obtiene el detalle de un viaje
      description: |
        Devuelve el viaje con su rol para el usuario y sus miembros activos. Solo lo pueden pedir los miembros del viaje.
        La PWA usa `pendiente_destino` para decidir qué mostrar al entrar: la votación del destino o el panel del viaje.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Detalle del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDelUsuario'
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido obtener el viaje
    patch:
      tags:
        - Viajes
      summary: Edita los datos de un viaje
      description: |
        Cambia el nombre, las fechas, el presupuesto o el destino de un viaje activo (PB-10).
        Solo lo puede hacer el creador del viaje. Se envían únicamente los campos que cambian (al menos uno);
        los que no se envían se quedan como estaban y los campos desconocidos se ignoran.
        Un viaje archivado es de solo lectura y no se puede editar.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiosViajeRequest'
      responses:
        '200':
          description: Viaje actualizado, con el mismo formato que el detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDelUsuario'
        '400':
          description: El identificador del viaje no es un UUID o los datos no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                id:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El identificador del viaje no es válido
                sinCambios:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: Indica al menos un dato del viaje que cambiar
                destino:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El destino no puede quedar vacío
                fechas:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: La fecha de fin no puede ser anterior a la de inicio
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          description: El usuario es miembro del viaje pero no su creador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: no_creador
                  mensaje: Solo el creador del viaje puede hacerlo
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '409':
          description: El viaje está cerrado o archivado y ya no se puede modificar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_activo
                  mensaje: El viaje está cerrado y ya no se puede modificar
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido modificar el viaje
    delete:
      tags:
        - Viajes
      summary: Elimina un viaje archivado
      description: |
        Borra el viaje para todos sus miembros, junto con todo lo asociado (miembros y, en el futuro, gastos,
        tareas, documentos...), que se elimina en cascada (PB-13). No se puede deshacer.
        Solo lo puede hacer el creador y solo con viajes archivados: la PWA lo ofrece desde «Viajes archivados».
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '204':
          description: Viaje eliminado (sin cuerpo)
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          description: El usuario es miembro del viaje pero no su creador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: no_creador
                  mensaje: Solo el creador del viaje puede hacerlo
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '409':
          description: El viaje no está archivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_archivado
                  mensaje: Solo se pueden eliminar viajes archivados
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido eliminar el viaje

  /viajes/{viajeId}/archivar:
    post:
      tags:
        - Viajes
      summary: Cierra y archiva un viaje
      description: |
        Pasa el viaje a estado `archivado` (PB-12). A partir de ese momento es un historial de solo lectura:
        no se puede editar ni añadir contenido (gastos, tareas...). Sale de «Mis viajes» y aparece en «Viajes archivados».
        Si el viaje estaba activo, se guarda el momento del cierre en `finalizado_en`.
        Solo lo puede hacer el creador del viaje. No se puede deshacer.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Viaje archivado, con el mismo formato que el detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDelUsuario'
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          description: El usuario es miembro del viaje pero no su creador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: no_creador
                  mensaje: Solo el creador del viaje puede hacerlo
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '409':
          description: El viaje ya estaba archivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_archivado
                  mensaje: El viaje ya está archivado
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido archivar el viaje

  /viajes/{viajeId}/invitacion:
    get:
      tags:
        - Invitaciones
      summary: Obtiene el enlace de invitación de un viaje
      description: |
        Devuelve el enlace permanente para unirse al viaje (RF10). Cada viaje tiene un único token (`viajes.token_invitacion`),
        que se genera al crear el viaje y no caduca. Puede pedirlo cualquier miembro activo del viaje.
        El código QR se genera en el cliente a partir de `enlace`.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Enlace de invitación del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnlaceInvitacion'
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_invitacion
                  mensaje: No se ha podido obtener el enlace de invitación

  /invitaciones/{token}/unirse:
    post:
      tags:
        - Invitaciones
      summary: Une al usuario autenticado al viaje del enlace de invitación
      description: |
        Registra al usuario de la sesión como miembro del viaje al que pertenece el token (RF11). Es la llamada que hace la PWA
        cuando el usuario abre el enlace o escanea el QR, una vez ha iniciado sesión.
        - Si el usuario ya era miembro, no cambia nada y responde 200 con `ya_era_miembro: true`.
        - Si había abandonado el viaje, se reactiva su pertenencia.
        - Si el usuario aún no tenía fila en `perfiles`, se crea con los datos de su cuenta.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Token de invitación del viaje (32 caracteres hexadecimales)
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
          example: 3f2b8c1d9e7a4f60b5d2c8a1e9f04b37
      responses:
        '200':
          description: El usuario es miembro del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnirseResponse'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El token no corresponde a ningún viaje o no tiene el formato esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: invitacion_no_encontrada
                  mensaje: El enlace de invitación no es válido
        '409':
          description: El viaje está finalizado o archivado y ya no admite nuevos miembros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_activo
                  mensaje: El viaje ya no admite nuevos miembros
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_invitacion
                  mensaje: No se ha podido completar la unión al viaje

  /viajes/{viajeId}/votaciones:
    get:
      tags:
        - Votaciones
      summary: Lista las votaciones de un viaje
      description: |
        Devuelve las votaciones del viaje, de la más reciente a la más antigua, cada una con sus opciones,
        el recuento de votos, quién ha votado cada opción y el voto del usuario (`mi_voto`).
        Solo lo pueden pedir los miembros del viaje. Se pueden filtrar por estado y por tipo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - name: estado
          in: query
          required: false
          description: Solo las votaciones abiertas o solo las cerradas
          schema:
            type: string
            enum: [abierta, cerrada]
        - name: tipo
          in: query
          required: false
          description: Solo las votaciones de este tipo
          schema:
            $ref: '#/components/schemas/TipoVotacion'
      responses:
        '200':
          description: Votaciones del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaVotaciones'
        '400':
          description: El identificador no es un UUID o un filtro no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El estado debe ser abierta o cerrada
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se han podido obtener las votaciones
    post:
      tags:
        - Votaciones
      summary: Crea una votación
      description: |
        Crea una votación del viaje con sus opciones iniciales (entre 2 y 20, sin repetir), en una sola operación.
        La puede crear cualquier miembro mientras el viaje está activo. Después, cualquier miembro puede proponer más opciones.
        No se pueden crear votaciones de destino: la del destino se abre sola al crear un viaje sin destino.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaVotacionRequest'
      responses:
        '201':
          description: Votación creada, con el mismo formato que el detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votacion'
        '400':
          description: Faltan datos, no son válidos o hay opciones repetidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: La votación necesita entre 2 y 20 opciones
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '409':
          description: El viaje está archivado o finalizado (solo lectura)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_activo
                  mensaje: El viaje está cerrado y ya no se puede modificar
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido crear la votación

  /viajes/{viajeId}/votaciones/{votacionId}:
    get:
      tags:
        - Votaciones
      summary: Obtiene una votación con su recuento
      description: |
        Devuelve la votación con sus opciones, el recuento, quién ha votado cada opción y el voto del usuario.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/VotacionId'
      responses:
        '200':
          description: Detalle de la votación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votacion'
        '400':
          $ref: '#/components/responses/IdVotacionInvalido'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/VotacionNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido obtener la votación

  /viajes/{viajeId}/votaciones/{votacionId}/opciones:
    post:
      tags:
        - Votaciones
      summary: Propone una opción nueva
      description: |
        Añade una opción al final de la votación. En la de destino, cada opción es un destino propuesto.
        Cualquier miembro puede proponerla mientras la votación está abierta y el viaje activo.
        No se puede repetir una opción de la misma votación (sin distinguir mayúsculas ni espacios).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/VotacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaOpcionRequest'
      responses:
        '201':
          description: Votación con la opción añadida y el recuento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votacion'
        '400':
          $ref: '#/components/responses/IdVotacionInvalido'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/VotacionNoEncontrada'
        '409':
          description: La opción ya existe, el viaje no está activo o la votación está cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                opcionDuplicada:
                  value:
                    error:
                      codigo: opcion_duplicada
                      mensaje: Esa opción ya está en la votación
                votacionCerrada:
                  value:
                    error:
                      codigo: votacion_cerrada
                      mensaje: La votación ya está cerrada
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido añadir la opción

  /viajes/{viajeId}/votaciones/{votacionId}/voto:
    put:
      tags:
        - Votaciones
      summary: Vota o cambia el voto
      description: |
        Guarda el voto del usuario en la opción indicada. Si ya había votado, lo cambia (un voto por persona).
        Solo mientras la votación está abierta y el viaje activo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/VotacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VotoRequest'
      responses:
        '200':
          description: Votación con el recuento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votacion'
        '400':
          description: Identificadores mal formados, falta la opción o la opción no es de esta votación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                datosInvalidos:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: Indica la opción que votas (opcion_id)
                opcionNoValida:
                  value:
                    error:
                      codigo: opcion_no_valida
                      mensaje: La opción no es de esta votación
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/VotacionNoEncontrada'
        '409':
          description: El viaje no está activo o la votación ya está cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viajeNoActivo:
                  value:
                    error:
                      codigo: viaje_no_activo
                      mensaje: El viaje está cerrado y ya no se puede modificar
                votacionCerrada:
                  value:
                    error:
                      codigo: votacion_cerrada
                      mensaje: La votación ya está cerrada
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido guardar el voto
    delete:
      tags:
        - Votaciones
      summary: Retira el voto
      description: |
        Borra el voto del usuario en la votación. Si no había votado, no cambia nada. Solo mientras la votación está abierta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/VotacionId'
      responses:
        '200':
          description: Votación con el recuento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votacion'
        '400':
          $ref: '#/components/responses/IdVotacionInvalido'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          $ref: '#/components/responses/VotacionNoEncontrada'
        '409':
          description: El viaje no está activo o la votación ya está cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viajeNoActivo:
                  value:
                    error:
                      codigo: viaje_no_activo
                      mensaje: El viaje está cerrado y ya no se puede modificar
                votacionCerrada:
                  value:
                    error:
                      codigo: votacion_cerrada
                      mensaje: La votación ya está cerrada
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido retirar el voto

  /viajes/{viajeId}/votaciones/{votacionId}/cerrar:
    post:
      tags:
        - Votaciones
      summary: Cierra una votación
      description: |
        Cierra la votación y guarda la opción ganadora: la más votada o, si hay empate, una de las empatadas elegida al azar
        (la PWA avisa del empate antes de confirmar). Ya no se puede votar ni proponer opciones.
        En la votación de destino guarda además el destino ganador en el viaje, en la misma operación: el viaje deja de estar
        pendiente de destino. La de destino necesita al menos un voto; las demás, sin votos, se cierran sin ganadora.
        Solo lo puede hacer el creador del viaje, con el viaje activo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/VotacionId'
      responses:
        '200':
          description: Votación cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreVotacion'
        '400':
          $ref: '#/components/responses/IdVotacionInvalido'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          description: El usuario es miembro del viaje pero no su creador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: no_creador
                  mensaje: Solo el creador del viaje puede cerrar las votaciones
        '404':
          $ref: '#/components/responses/VotacionNoEncontrada'
        '409':
          description: La votación ya está cerrada, el viaje no está activo o la de destino no tiene votos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                votacionCerrada:
                  value:
                    error:
                      codigo: votacion_cerrada
                      mensaje: La votación ya está cerrada
                sinVotos:
                  value:
                    error:
                      codigo: sin_votos
                      mensaje: La votación de destino necesita al menos un voto para cerrarse
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_votacion
                  mensaje: No se ha podido cerrar la votación

  /viajes/{viajeId}/actividades:
    post:
      tags:
        - Actividades
      summary: Crea una actividad del itinerario
      description: |
        Añade una actividad al itinerario del viaje, en el día indicado y al final de las que ya tenga ese día.
        La puede crear cualquier miembro mientras el viaje está activo. La ubicación es un texto libre.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaActividadRequest'
      responses:
        '201':
          description: Actividad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividad'
        '400':
          description: Faltan datos, no son válidos o el identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: La fecha es obligatoria y debe tener el formato AAAA-MM-DD
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '409':
          description: El viaje está archivado o finalizado (solo lectura)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_activo
                  mensaje: El viaje está cerrado y ya no se puede modificar
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_actividad
                  mensaje: No se ha podido crear la actividad

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauthStateCookie:
      type: apiKey
      in: cookie
      name: tw_oauth
      description: Estado PKCE del login con Google, creado por GET /auth/google
  parameters:
    ViajeId:
      name: viajeId
      in: path
      required: true
      description: Identificador del viaje
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    VotacionId:
      name: votacionId
      in: path
      required: true
      description: Identificador de la votación
      schema:
        type: string
        format: uuid
      example: 6f1c2d3e-0000-4000-8000-000000000010
  responses:
    SinSesion:
      description: Falta la cabecera Authorization Bearer, o el token ha caducado o no es válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinSesion:
              value:
                error:
                  codigo: sin_sesion
                  mensaje: Falta el token de acceso
            sesionInvalida:
              value:
                error:
                  codigo: sesion_invalida
                  mensaje: La sesión ha caducado o no es válida
    IdVotacionInvalido:
      description: El identificador del viaje o de la votación no es un UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: datos_invalidos
              mensaje: El identificador del viaje o de la votación no es válido
    VotacionNoEncontrada:
      description: El viaje no existe, el usuario no es miembro o la votación no es de ese viaje
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            viajeNoEncontrado:
              value:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
            votacionNoEncontrada:
              value:
                error:
                  codigo: votacion_no_encontrada
                  mensaje: La votación no existe en este viaje
    ErrorInterno:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: error_interno
              mensaje: Error interno del servidor
  schemas:
    RegistroRequest:
      type: object
      required:
        - nombre
        - email
        - password
      properties:
        nombre:
          type: string
          maxLength: 100
          description: Nombre visible. Se guarda en perfiles.nombre
          example: "Daniel"
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"
        password:
          type: string
          format: password
          minLength: 8
          example: "MiContraseña123"

    RegistroResponse:
      oneOf:
        - $ref: '#/components/schemas/RegistroPendiente'
        - $ref: '#/components/schemas/LoginResponse'

    RegistroPendiente:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        confirmacion_pendiente:
          type: boolean
          enum: [true]
          description: El usuario debe confirmar su email antes de poder iniciar sesión

    ReenvioConfirmacionRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"
        password:
          type: string
          format: password
          example: "MiContraseña123"

    LoginResponse:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        token:
          type: string
          description: JWT de acceso
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Token para renovar la sesión
          example: "v1.MRjcyF2bXh0..."

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "v1.MRjcyF2bXh0..."

    RefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: Nuevo JWT de acceso
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Nuevo refresh token (el anterior deja de ser válido)
          example: "v1.Xk29aPq7..."

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          nullable: true
          description: perfiles.nombre. Con Google se toma del nombre de la cuenta la primera vez. Nulo si el usuario aún no tiene perfil
          example: "Daniel"
        email:
          type: string
          format: email
          description: perfiles.email, o el email de Supabase Auth si no hay perfil
          example: "daniel@travelwrap.app"
        avatar_url:
          type: string
          nullable: true
          description: perfiles.avatar_url. Con Google, la foto de la cuenta
          example: null
        creado_en:
          type: string
          format: date-time
          description: perfiles.creado_en, o la fecha de alta en Supabase Auth si no hay perfil
          example: "2026-10-07T18:00:00Z"

    NuevoViajeRequest:
      type: object
      required:
        - nombre
        - presupuesto
      properties:
        nombre:
          type: string
          maxLength: 100
          example: "Verano 2027"
        presupuesto:
          type: number
          minimum: 0
          description: Presupuesto estimado del viaje en su moneda (EUR). Se puede cambiar después
          example: 850
        destino:
          type: string
          nullable: true
          maxLength: 100
          description: Si es null, está ausente o es una cadena vacía, el viaje queda pendiente de decidir el destino por votación
          example: "Roma"
        fecha_inicio:
          type: string
          format: date
          nullable: true
          example: "2027-07-01"
        fecha_fin:
          type: string
          format: date
          nullable: true
          description: No puede ser anterior a fecha_inicio
          example: "2027-07-08"

    CambiosViajeRequest:
      type: object
      description: Campos a cambiar. Todos son opcionales, pero hay que enviar al menos uno
      minProperties: 1
      properties:
        nombre:
          type: string
          maxLength: 100
          example: "Roma 2027 (puente de mayo)"
        presupuesto:
          type: number
          minimum: 0
          example: 950
        destino:
          type: string
          maxLength: 100
          description: Se puede cambiar, pero no dejar vacío (no admite null ni cadena vacía)
          example: "Roma"
        fecha_inicio:
          type: string
          format: date
          nullable: true
          description: null para quitar la fecha
          example: "2027-05-11"
        fecha_fin:
          type: string
          format: date
          nullable: true
          description: null para quitar la fecha. No puede ser anterior a fecha_inicio (la enviada o la ya guardada)
          example: "2027-05-15"

    Viaje:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          example: "Verano 2027"
        destino:
          type: string
          nullable: true
          description: Null mientras el destino está pendiente de decidir por votación
          example: "Roma"
        descripcion:
          type: string
          nullable: true
          example: null
        fecha_inicio:
          type: string
          format: date
          nullable: true
          example: "2027-07-01"
        fecha_fin:
          type: string
          format: date
          nullable: true
          example: "2027-07-08"
        moneda:
          type: string
          example: "EUR"
        presupuesto:
          type: number
          example: 850
        estado:
          type: string
          enum: [activo, finalizado, archivado]
          example: activo
        creado_en:
          type: string
          format: date-time
          example: "2026-10-12T10:00:00Z"
        pendiente_destino:
          type: boolean
          description: true si el viaje está activo y aún no tiene destino. Se deduce de estado y destino, no se guarda
          example: false

    MiembroViaje:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
          example: "df77cba6-4be5-4cbc-814b-1e228dd73dcc"
        nombre:
          type: string
          nullable: true
          example: "Daniel"
        avatar_url:
          type: string
          nullable: true
          example: null
        rol:
          type: string
          enum: [creador, miembro]
          example: creador

    ViajeDelUsuario:
      allOf:
        - $ref: '#/components/schemas/Viaje'
        - type: object
          properties:
            rol:
              type: string
              enum: [creador, miembro]
              description: Rol del usuario que hace la petición en este viaje
              example: creador
            miembros:
              type: array
              description: Miembros activos del viaje
              items:
                $ref: '#/components/schemas/MiembroViaje'

    ListaViajes:
      type: object
      properties:
        viajes:
          type: array
          items:
            $ref: '#/components/schemas/ViajeDelUsuario'

    EnlaceInvitacion:
      type: object
      properties:
        token:
          type: string
          description: viajes.token_invitacion
          example: "3f2b8c1d9e7a4f60b5d2c8a1e9f04b37"
        enlace:
          type: string
          format: uri
          description: URL completa a compartir, `{FRONTEND_URL}/unirse/{token}`. El QR se genera en el cliente a partir de ella
          example: "http://localhost:5173/unirse/3f2b8c1d9e7a4f60b5d2c8a1e9f04b37"

    UnirseResponse:
      type: object
      properties:
        viaje:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "123e4567-e89b-12d3-a456-426614174000"
            nombre:
              type: string
              example: "Roma 2025"
            destino:
              type: string
              nullable: true
              description: Null mientras el destino está pendiente de decidir por votación
              example: "Roma, Italia"
            imagen_portada_url:
              type: string
              nullable: true
              example: null
        miembro:
          type: object
          properties:
            rol:
              type: string
              enum: [creador, miembro]
              example: miembro
            unido_en:
              type: string
              format: date-time
              example: "2026-10-11T16:30:00Z"
        ya_era_miembro:
          type: boolean
          description: true si el usuario ya pertenecía al viaje antes de esta llamada
          example: false

    TipoVotacion:
      type: string
      enum: [fecha, destino, presupuesto, actividad, otro]
      example: fecha

    NuevaOpcionRequest:
      type: object
      required:
        - texto
      properties:
        texto:
          type: string
          maxLength: 100
          description: Se guarda sin espacios a los lados
          example: "Viernes 14"
        valor_fecha:
          type: string
          format: date
          nullable: true
          description: Fecha que representa la opción, en las votaciones de fechas (opcional)
          example: "2027-05-14"

    NuevaVotacionRequest:
      type: object
      required:
        - titulo
        - opciones
      properties:
        titulo:
          type: string
          maxLength: 200
          example: "¿Qué fin de semana salimos?"
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          example: null
        tipo:
          type: string
          enum: [fecha, presupuesto, actividad, otro]
          default: otro
          description: Las de destino no se crean a mano
          example: fecha
        opciones:
          type: array
          minItems: 2
          maxItems: 20
          description: Opciones iniciales, en el orden en que se mostrarán. No se pueden repetir
          items:
            $ref: '#/components/schemas/NuevaOpcionRequest'

    VotoRequest:
      type: object
      required:
        - opcion_id
      properties:
        opcion_id:
          type: string
          format: uuid
          description: Opción que vota el usuario. Tiene que ser de esta votación
          example: "6f1c2d3e-0000-4000-8000-0000000000a1"

    OpcionVotacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "6f1c2d3e-0000-4000-8000-0000000000a1"
        texto:
          type: string
          example: "Viernes 14"
        valor_fecha:
          type: string
          format: date
          nullable: true
          example: "2027-05-14"
        orden:
          type: integer
          description: Posición en la lista; las propuestas nuevas van al final
          example: 0
        votos:
          type: integer
          example: 2
        votantes:
          type: array
          description: Identificadores de los usuarios que han votado esta opción
          items:
            type: string
            format: uuid
          example: ["df77cba6-4be5-4cbc-814b-1e228dd73dcc"]

    Votacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "6f1c2d3e-0000-4000-8000-000000000010"
        titulo:
          type: string
          example: "¿Qué fin de semana salimos?"
        descripcion:
          type: string
          nullable: true
          example: null
        tipo:
          $ref: '#/components/schemas/TipoVotacion'
        estado:
          type: string
          enum: [abierta, cerrada]
          example: abierta
        opcion_ganadora_id:
          type: string
          format: uuid
          nullable: true
          description: Opción ganadora, al cerrar la votación (null mientras está abierta o si se cerró sin votos)
          example: null
        creado_por:
          type: string
          format: uuid
          nullable: true
          example: "df77cba6-4be5-4cbc-814b-1e228dd73dcc"
        creado_en:
          type: string
          format: date-time
          example: "2026-10-20T10:00:00Z"
        cerrada_en:
          type: string
          format: date-time
          nullable: true
          example: null
        opciones:
          type: array
          description: Opciones en su orden, con el recuento
          items:
            $ref: '#/components/schemas/OpcionVotacion'
        total_votos:
          type: integer
          example: 3
        total_miembros:
          type: integer
          description: Miembros activos del viaje, es decir, cuántos pueden votar
          example: 4
        mi_voto:
          type: string
          format: uuid
          nullable: true
          description: Opción que ha votado el usuario que hace la petición, o null si no ha votado
          example: "6f1c2d3e-0000-4000-8000-0000000000a1"

    ListaVotaciones:
      type: object
      properties:
        votaciones:
          type: array
          items:
            $ref: '#/components/schemas/Votacion'

    CierreVotacion:
      type: object
      properties:
        votacion:
          $ref: '#/components/schemas/Votacion'
        hubo_empate:
          type: boolean
          description: true si varias opciones empataron con más votos y la ganadora se eligió al azar
          example: false
        destino:
          type: string
          nullable: true
          description: Destino guardado en el viaje (solo al cerrar la votación de destino)
          example: null

    NuevaActividadRequest:
      type: object
      required:
        - titulo
        - fecha
      properties:
        titulo:
          type: string
          maxLength: 200
          description: Nombre de la actividad
          example: Visita al Coliseo
        fecha:
          type: string
          format: date
          description: Día de la actividad (AAAA-MM-DD)
          example: '2027-05-12'
        hora_inicio:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Hora de inicio (HH:MM). Opcional
          example: '10:00'
        ubicacion_nombre:
          type: string
          nullable: true
          maxLength: 200
          description: Lugar o dirección, como texto libre. Opcional
          example: Piazza del Colosseo

    Actividad:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8a1b2c3d-0000-4000-8000-000000000020
        viaje_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        titulo:
          type: string
          example: Visita al Coliseo
        descripcion:
          type: string
          nullable: true
          example: null
        fecha:
          type: string
          format: date
          example: '2027-05-12'
        hora_inicio:
          type: string
          nullable: true
          description: Hora de inicio (HH:MM:SS)
          example: '10:00:00'
        hora_fin:
          type: string
          nullable: true
          description: Hora de fin (HH:MM:SS)
          example: null
        orden:
          type: integer
          description: Posición dentro del día; la nueva actividad va al final
          example: 0
        ubicacion_nombre:
          type: string
          nullable: true
          example: Piazza del Colosseo
        latitud:
          type: number
          nullable: true
          example: null
        longitud:
          type: number
          nullable: true
          example: null
        lugar_externo_id:
          type: string
          nullable: true
          example: null
        categoria:
          type: string
          nullable: true
          example: null
        creado_por:
          type: string
          format: uuid
          nullable: true
          example: df77cba6-4be5-4cbc-814b-1e228dd73dcc
        creado_en:
          type: string
          format: date-time
          example: '2026-10-24T10:00:00Z'
        actualizado_en:
          type: string
          format: date-time
          example: '2026-10-24T10:00:00Z'

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo:
              type: string
              example: credenciales_invalidas
            mensaje:
              type: string
              example: Email o contraseña incorrectos
