openapi: 3.0.0
info:
  title: TravelWrap API
  description: API REST para la gestión de viajes grupales, gastos y tareas.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths:
  /health:
    get:
      summary: Comprueba el estado del servidor
      responses:
        '200':
          description: Servidor operativo

  /auth/registro:
    post:
      tags:
        - Autenticación
      summary: Registra un usuario con email y contraseña
      description: |
        Crea la cuenta en Supabase Auth guardando el nombre. El proyecto exige confirmar el email, así que lo normal es que
        la respuesta sea `201` con `confirmacion_pendiente: true` (sin tokens): el usuario recibe un correo y, una vez confirmado,
        inicia sesión con `POST /auth/login`, momento en el que se crea su fila en `perfiles`.
        Si el proyecto no exigiera confirmar el email, la respuesta incluye ya la sesión (`token` y `refresh_token`) y el perfil queda creado.
        Si el email ya tiene cuenta confirmada, responde 409. Si la cuenta existe pero no está confirmada, se reenvía el correo de confirmación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada. Pendiente de confirmar el email, o con sesión iniciada si no se exige confirmación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
              examples:
                confirmacionPendiente:
                  summary: Confirmación de email pendiente (caso habitual)
                  value:
                    usuario:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      nombre: Daniel
                      email: daniel@travelwrap.app
                      avatar_url: null
                      creado_en: '2026-10-11T18:00:00Z'
                    confirmacion_pendiente: true
        '400':
          description: Datos inválidos (nombre vacío o de más de 100 caracteres, email mal formado o contraseña de menos de 8 caracteres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombre:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El nombre es obligatorio y tiene un máximo de 100 caracteres
                email:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El email no es válido
                password:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: La contraseña debe tener al menos 8 caracteres
        '409':
          description: Ya existe una cuenta con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: email_en_uso
                  mensaje: Ya existe una cuenta con ese email
        '429':
          description: Demasiados intentos; Supabase limita el envío de correos de confirmación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: demasiados_intentos
                  mensaje: Demasiados intentos, inténtalo más tarde
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reenviar-confirmacion:
    post:
      tags:
        - Autenticación
      summary: Reenvía el correo de confirmación de la cuenta
      description: |
        Para usuarios registrados que aún no han confirmado su email (el login responde 401 `email_no_confirmado`).
        Por seguridad responde siempre `202` con el mismo mensaje, exista o no una cuenta pendiente con ese email,
        para no revelar qué emails están registrados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioConfirmacionRequest'
      responses:
        '202':
          description: Solicitud aceptada. Si hay una cuenta pendiente de confirmar con ese email, recibirá un correo nuevo
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Si existe una cuenta pendiente de confirmar con ese email, recibirás un correo de confirmación
        '400':
          description: Email con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El email no es válido
        '429':
          description: Se han pedido demasiados correos seguidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: demasiados_intentos
                  mensaje: Espera un momento antes de volver a pedir el correo
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicia sesión con email y contraseña
      description: Autentica al usuario mediante Supabase Auth y devuelve el usuario, el token de acceso (JWT) y el refresh token. El token se envía en el resto de peticiones con la cabecera Authorization Bearer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos de entrada inválidos (email con formato incorrecto o contraseña vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El email no es válido
        '401':
          description: Credenciales incorrectas o email sin confirmar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                credencialesInvalidas:
                  value:
                    error:
                      codigo: credenciales_invalidas
                      mensaje: Email o contraseña incorrectos
                emailNoConfirmado:
                  value:
                    error:
                      codigo: email_no_confirmado
                      mensaje: El email no está confirmado
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renueva la sesión con el refresh token
      description: Intercambia un refresh token válido por un nuevo token de acceso y un nuevo refresh token mediante Supabase Auth. Permite mantener la sesión iniciada al volver a abrir la aplicación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión renovada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Falta el refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El refresh_token es obligatorio
        '401':
          description: El refresh token ha caducado, ya se ha usado o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: sesion_invalida
                  mensaje: La sesión ha caducado o no es válida
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cierra la sesión actual
      description: |
        Invalida en Supabase Auth la sesión del dispositivo que hace la petición (alcance `local`): el refresh token deja de servir
        y Supabase rechaza el token de acceso. Las sesiones abiertas en otros dispositivos no se tocan.
        La PWA llama a este endpoint al confirmar «Cerrar sesión» y, aunque falle, borra siempre la sesión guardada en el navegador.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada. Sin contenido
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con el servicio de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_autenticacion
                  mensaje: No se ha podido cerrar la sesión

  /auth/google:
    get:
      tags:
        - Autenticación
      summary: Inicia el login con Google (OAuth 2.0 + PKCE)
      description: |
        Punto de entrada del botón «Continuar con Google». La PWA navega a esta URL (no es una llamada fetch).
        El backend genera el flujo PKCE de Supabase Auth, guarda el verificador en la cookie `tw_oauth`
        y redirige a Supabase, que a su vez redirige a la pantalla de consentimiento de Google.
        Cuando el usuario acepta, Supabase vuelve a `GET /auth/google/callback`.
      security: []
      responses:
        '302':
          description: |
            Redirección. Si el flujo se ha podido iniciar, `Location` apunta a
            `{SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=...&code_challenge=...&code_challenge_method=s256`
            y se envía la cookie `tw_oauth`. Si no, redirige a la PWA con `#error=google`.
          headers:
            Location:
              description: URL de autorización de Supabase, o `{FRONTEND_URL}/auth/callback#error=google` si falla
              schema:
                type: string
                format: uri
              example: https://gbnivsmutqlnqvcrmcvj.supabase.co/auth/v1/authorize?provider=google&redirect_to=http%3A%2F%2Flocalhost%3A3000%2Fapi%2Fauth%2Fgoogle%2Fcallback&code_challenge=jpsA5IMF546ZtE29jcPPiDoEWJOAtBkNUOoeGzozmAM&code_challenge_method=s256
            Set-Cookie:
              description: Cookie con el estado PKCE del flujo, codificado en base64url. HttpOnly, SameSite=Lax, Path=/api/auth/google, caduca en 10 minutos
              schema:
                type: string
              example: tw_oauth=eyJzYi1...; Max-Age=600; Path=/api/auth/google; HttpOnly; SameSite=Lax

  /auth/google/callback:
    get:
      tags:
        - Autenticación
      summary: Recibe la respuesta de Google y completa el login
      description: |
        URL de vuelta configurada en Supabase (Authentication → URL Configuration → Redirect URLs).
        El backend canjea el `code` por la sesión usando el verificador PKCE de la cookie `tw_oauth`, borra la cookie
        y, si es el primer acceso del usuario, crea su fila en `perfiles` con el nombre, el email y la foto de Google.
        Si ya existía una cuenta con el mismo email verificado, Supabase la vincula al mismo usuario.

        El resultado se entrega a la PWA redirigiendo a `{FRONTEND_URL}/auth/callback` con un fragmento (`#`),
        que el navegador no envía a ningún servidor:
        - Éxito: `#sesion=<base64url de un JSON con el formato de LoginResponse>`
        - Usuario cancela en Google: `#error=google_cancelado`
        - Cualquier otro fallo (falta la cookie o el código, código inválido o caducado): `#error=google`
      security:
        - oauthStateCookie: []
      parameters:
        - name: code
          in: query
          required: false
          description: Código de autorización de un solo uso que envía Supabase si el usuario acepta
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Presente si el usuario cancela o Google rechaza el acceso
          schema:
            type: string
            example: access_denied
        - name: error_description
          in: query
          required: false
          description: Descripción del error enviada por Supabase
          schema:
            type: string
      responses:
        '302':
          description: Redirección a la PWA con el resultado en el fragmento de la URL. Siempre borra la cookie `tw_oauth`
          headers:
            Location:
              description: '`{FRONTEND_URL}/auth/callback#sesion=...`, `#error=google_cancelado` o `#error=google`'
              schema:
                type: string
                format: uri
              examples:
                exito:
                  value: http://localhost:5173/auth/callback#sesion=eyJ1c3VhcmlvIjp7ImlkIjoiZGY3N2Nj...
                cancelado:
                  value: http://localhost:5173/auth/callback#error=google_cancelado
                error:
                  value: http://localhost:5173/auth/callback#error=google

  /viajes:
    get:
      tags:
        - Viajes
      summary: Lista los viajes del usuario
      description: |
        Devuelve los viajes de los que el usuario es miembro activo, del más reciente al más antiguo, con sus miembros.
        La PWA los reparte en «Mis viajes»: los activos con destino (tarjeta azul), los activos sin destino
        (`pendiente_destino: true`, tarjeta verde) y, por estado, los finalizados y archivados (viajes anteriores).
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Devuelve solo los viajes en ese estado
          schema:
            type: string
            enum: [activo, finalizado, archivado]
      responses:
        '200':
          description: Viajes del usuario (lista vacía si no tiene ninguno)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaViajes'
        '400':
          description: El filtro `estado` no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El estado debe ser activo, finalizado o archivado
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se han podido obtener los viajes
    post:
      tags:
        - Viajes
      summary: Crea un viaje
      description: |
        Crea un viaje activo y añade al usuario como miembro con rol `creador`, en una sola operación.
        El nombre y el presupuesto son obligatorios. Las fechas y el destino son opcionales.
        Si no se indica destino (`null`, ausente o cadena vacía) el viaje queda **pendiente de destino**
        (`pendiente_destino: true`): hasta que el creador fije el destino por votación, solo se podrá votar e invitar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoViajeRequest'
      responses:
        '201':
          description: Viaje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombre:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El nombre es obligatorio y tiene un máximo de 100 caracteres
                presupuesto:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: El presupuesto es obligatorio y debe ser un número entre 0 y 9999999999
                fechas:
                  value:
                    error:
                      codigo: datos_invalidos
                      mensaje: La fecha de fin no puede ser anterior a la de inicio
        '401':
          $ref: '#/components/responses/SinSesion'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido crear el viaje

  /viajes/{viajeId}:
    get:
      tags:
        - Viajes
      summary: Obtiene el detalle de un viaje
      description: |
        Devuelve el viaje con su rol para el usuario y sus miembros activos. Solo lo pueden pedir los miembros del viaje.
        La PWA usa `pendiente_destino` para decidir qué mostrar al entrar: la votación del destino o el panel del viaje.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Detalle del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDelUsuario'
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_viaje
                  mensaje: No se ha podido obtener el viaje

  /viajes/{viajeId}/invitacion:
    get:
      tags:
        - Invitaciones
      summary: Obtiene el enlace de invitación de un viaje
      description: |
        Devuelve el enlace permanente para unirse al viaje (RF10). Cada viaje tiene un único token (`viajes.token_invitacion`),
        que se genera al crear el viaje y no caduca. Puede pedirlo cualquier miembro activo del viaje.
        El código QR se genera en el cliente a partir de `enlace`.
      security:
        - bearerAuth: []
      parameters:
        - name: viajeId
          in: path
          required: true
          description: Identificador del viaje
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Enlace de invitación del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnlaceInvitacion'
        '400':
          description: El identificador del viaje no es un UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: datos_invalidos
                  mensaje: El identificador del viaje no es válido
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El viaje no existe o el usuario no es miembro (las políticas RLS no permiten distinguir ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_encontrado
                  mensaje: El viaje no existe o no perteneces a él
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_invitacion
                  mensaje: No se ha podido obtener el enlace de invitación

  /invitaciones/{token}/unirse:
    post:
      tags:
        - Invitaciones
      summary: Une al usuario autenticado al viaje del enlace de invitación
      description: |
        Registra al usuario de la sesión como miembro del viaje al que pertenece el token (RF11). Es la llamada que hace la PWA
        cuando el usuario abre el enlace o escanea el QR, una vez ha iniciado sesión.
        - Si el usuario ya era miembro, no cambia nada y responde 200 con `ya_era_miembro: true`.
        - Si había abandonado el viaje, se reactiva su pertenencia.
        - Si el usuario aún no tenía fila en `perfiles`, se crea con los datos de su cuenta.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Token de invitación del viaje (32 caracteres hexadecimales)
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
          example: 3f2b8c1d9e7a4f60b5d2c8a1e9f04b37
      responses:
        '200':
          description: El usuario es miembro del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnirseResponse'
        '401':
          $ref: '#/components/responses/SinSesion'
        '404':
          description: El token no corresponde a ningún viaje o no tiene el formato esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: invitacion_no_encontrada
                  mensaje: El enlace de invitación no es válido
        '409':
          description: El viaje está finalizado o archivado y ya no admite nuevos miembros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: viaje_no_activo
                  mensaje: El viaje ya no admite nuevos miembros
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Error al comunicarse con Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: error_invitacion
                  mensaje: No se ha podido completar la unión al viaje

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauthStateCookie:
      type: apiKey
      in: cookie
      name: tw_oauth
      description: Estado PKCE del login con Google, creado por GET /auth/google
  responses:
    SinSesion:
      description: Falta la cabecera Authorization Bearer, o el token ha caducado o no es válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinSesion:
              value:
                error:
                  codigo: sin_sesion
                  mensaje: Falta el token de acceso
            sesionInvalida:
              value:
                error:
                  codigo: sesion_invalida
                  mensaje: La sesión ha caducado o no es válida
  schemas:
    RegistroRequest:
      type: object
      required:
        - nombre
        - email
        - password
      properties:
        nombre:
          type: string
          maxLength: 100
          description: Nombre visible. Se guarda en perfiles.nombre
          example: "Daniel"
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"
        password:
          type: string
          format: password
          minLength: 8
          example: "MiContraseña123"

    RegistroResponse:
      oneOf:
        - $ref: '#/components/schemas/RegistroPendiente'
        - $ref: '#/components/schemas/LoginResponse'

    RegistroPendiente:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        confirmacion_pendiente:
          type: boolean
          enum: [true]
          description: El usuario debe confirmar su email antes de poder iniciar sesión

    ReenvioConfirmacionRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "daniel@travelwrap.app"
        password:
          type: string
          format: password
          example: "MiContraseña123"

    LoginResponse:
      type: object
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        token:
          type: string
          description: JWT de acceso
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Token para renovar la sesión
          example: "v1.MRjcyF2bXh0..."

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "v1.MRjcyF2bXh0..."

    RefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: Nuevo JWT de acceso
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Nuevo refresh token (el anterior deja de ser válido)
          example: "v1.Xk29aPq7..."

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          nullable: true
          description: perfiles.nombre. Con Google se toma del nombre de la cuenta la primera vez. Nulo si el usuario aún no tiene perfil
          example: "Daniel"
        email:
          type: string
          format: email
          description: perfiles.email, o el email de Supabase Auth si no hay perfil
          example: "daniel@travelwrap.app"
        avatar_url:
          type: string
          nullable: true
          description: perfiles.avatar_url. Con Google, la foto de la cuenta
          example: null
        creado_en:
          type: string
          format: date-time
          description: perfiles.creado_en, o la fecha de alta en Supabase Auth si no hay perfil
          example: "2026-10-07T18:00:00Z"

    NuevoViajeRequest:
      type: object
      required:
        - nombre
        - presupuesto
      properties:
        nombre:
          type: string
          maxLength: 100
          example: "Verano 2027"
        presupuesto:
          type: number
          minimum: 0
          description: Presupuesto estimado del viaje en su moneda (EUR). Se puede cambiar después
          example: 850
        destino:
          type: string
          nullable: true
          maxLength: 100
          description: Si es null, está ausente o es una cadena vacía, el viaje queda pendiente de decidir el destino por votación
          example: "Roma"
        fecha_inicio:
          type: string
          format: date
          nullable: true
          example: "2027-07-01"
        fecha_fin:
          type: string
          format: date
          nullable: true
          description: No puede ser anterior a fecha_inicio
          example: "2027-07-08"

    Viaje:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          example: "Verano 2027"
        destino:
          type: string
          nullable: true
          description: Null mientras el destino está pendiente de decidir por votación
          example: "Roma"
        descripcion:
          type: string
          nullable: true
          example: null
        fecha_inicio:
          type: string
          format: date
          nullable: true
          example: "2027-07-01"
        fecha_fin:
          type: string
          format: date
          nullable: true
          example: "2027-07-08"
        moneda:
          type: string
          example: "EUR"
        presupuesto:
          type: number
          example: 850
        estado:
          type: string
          enum: [activo, finalizado, archivado]
          example: activo
        creado_en:
          type: string
          format: date-time
          example: "2026-10-12T10:00:00Z"
        pendiente_destino:
          type: boolean
          description: true si el viaje está activo y aún no tiene destino. Se deduce de estado y destino, no se guarda
          example: false

    MiembroViaje:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
          example: "df77cba6-4be5-4cbc-814b-1e228dd73dcc"
        nombre:
          type: string
          nullable: true
          example: "Daniel"
        avatar_url:
          type: string
          nullable: true
          example: null
        rol:
          type: string
          enum: [creador, miembro]
          example: creador

    ViajeDelUsuario:
      allOf:
        - $ref: '#/components/schemas/Viaje'
        - type: object
          properties:
            rol:
              type: string
              enum: [creador, miembro]
              description: Rol del usuario que hace la petición en este viaje
              example: creador
            miembros:
              type: array
              description: Miembros activos del viaje
              items:
                $ref: '#/components/schemas/MiembroViaje'

    ListaViajes:
      type: object
      properties:
        viajes:
          type: array
          items:
            $ref: '#/components/schemas/ViajeDelUsuario'

    EnlaceInvitacion:
      type: object
      properties:
        token:
          type: string
          description: viajes.token_invitacion
          example: "3f2b8c1d9e7a4f60b5d2c8a1e9f04b37"
        enlace:
          type: string
          format: uri
          description: URL completa a compartir, `{FRONTEND_URL}/unirse/{token}`. El QR se genera en el cliente a partir de ella
          example: "http://localhost:5173/unirse/3f2b8c1d9e7a4f60b5d2c8a1e9f04b37"

    UnirseResponse:
      type: object
      properties:
        viaje:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "123e4567-e89b-12d3-a456-426614174000"
            nombre:
              type: string
              example: "Roma 2025"
            destino:
              type: string
              nullable: true
              description: Null mientras el destino está pendiente de decidir por votación
              example: "Roma, Italia"
            imagen_portada_url:
              type: string
              nullable: true
              example: null
        miembro:
          type: object
          properties:
            rol:
              type: string
              enum: [creador, miembro]
              example: miembro
            unido_en:
              type: string
              format: date-time
              example: "2026-10-11T16:30:00Z"
        ya_era_miembro:
          type: boolean
          description: true si el usuario ya pertenecía al viaje antes de esta llamada
          example: false

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo:
              type: string
              example: credenciales_invalidas
            mensaje:
              type: string
              example: Email o contraseña incorrectos
